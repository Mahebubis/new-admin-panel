# Optional: put the status dashboard behind nginx with TLS and basic auth,
# instead of exposing port 8080 directly.
#
#   sudo apt install -y nginx apache2-utils certbot python3-certbot-nginx
#   sudo htpasswd -c /etc/nginx/.htpasswd-monitor yourname
#   sudo cp nginx.conf /etc/nginx/sites-available/istudio-monitoring
#   sudo ln -s /etc/nginx/sites-available/istudio-monitoring /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d monitor.internshipstudio.com

server {
    listen 80;
    server_name monitor.internshipstudio.com;

    # /healthz stays open so an external uptime service can watch the monitor
    # itself. It leaks only "ok" or "degraded" plus the failing check names.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        auth_basic "iStudio Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitor;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
